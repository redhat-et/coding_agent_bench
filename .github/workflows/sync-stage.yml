name: Sync stage with main

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-stage
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out stage
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/stage
          fetch-depth: 0

      - name: Prepare sync branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B sync/main-into-stage origin/stage
          git merge origin/main --no-edit

      - name: Push sync branch
        run: git push --force-with-lease origin HEAD:sync/main-into-stage

      - name: Create or update sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=$(gh pr list \
            --base stage \
            --head sync/main-into-stage \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$pr_number" ]; then
            gh pr create \
              --base stage \
              --head sync/main-into-stage \
              --title "Sync main into stage" \
              --body "Automatically sync the merged main changes into stage."
            pr_number=$(gh pr list \
              --base stage \
              --head sync/main-into-stage \
              --state open \
              --json number \
              --jq '.[0].number')
            gh pr merge "$pr_number" --auto --merge
          else
            echo "Sync pull request #$pr_number is already open."
          fi
