apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-queue
  labels:
    name: job-queue
    app: job-queue
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: job-queue
      component: api
  template:
    metadata:
      labels:
        name: job-queue
        app: job-queue
        component: api
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: harbor-orchestrator
      containers:
      - image: ghcr.io/redhat-et/coding_agent_bench:tag
        name: job-queue
        command: ["/bin/sh", "-c"]
        args:
          - |
            if [ ! -f /app/data/nebius-ssh-key ]; then
              ssh-keygen -t ed25519 -f /app/data/nebius-ssh-key -N "" -q || exit 1
            fi
            test -r /app/data/nebius-ssh-key || exit 1
            exec env \
              NEBIUS_SSH_PUBLIC_KEY_PATH=/app/data/nebius-ssh-key.pub \
              NEBIUS_SSH_PRIVATE_KEY_PATH=/app/data/nebius-ssh-key \
              uv run --no-sync uvicorn coding_agent_bench.api:app --host 0.0.0.0 --port 8443 \
              --ssl-certfile /etc/job-queue/tls/tls.crt \
              --ssl-keyfile /etc/job-queue/tls/tls.key
        resources:
          requests:
            cpu: "1"
            memory: "500M"
          limits:
            cpu: "1"
            memory: "1Gi"
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: ENVIRONMENT
          value: stage
        - name: STORAGE_ENDPOINT_URL
          value: http://harbor-storage:9000
        - name: HOME
          value: /tmp
        - name: UV_CACHE_DIR
          value: /tmp/uv-cache
        - name: JOB_STORE_PATH
          value: /app/data/jobs.db
        - name: CODING_AGENT_BENCH_IMAGE
          value: ghcr.io/redhat-et/coding_agent_bench:tag
        envFrom:
        - secretRef:
            name: job-queue-secret
        - secretRef:
            name: nebius-secret
            optional: true
        ports:
        - containerPort: 8443
          name: https
        imagePullPolicy: Always
        volumeMounts:
        - mountPath: /app/data
          name: data
        - mountPath: /etc/job-queue/tls
          name: tls
          readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: job-queue-pvc
        - name: tls
          secret:
            secretName: job-queue-tls
            defaultMode: 0440
      restartPolicy: Always
