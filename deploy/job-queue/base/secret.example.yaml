apiVersion: v1
kind: Secret
metadata:
  name: job-queue-secret
type: Opaque
stringData:
  # Required by the job-queue API and the intake poller.
  API_KEY: <job-queue-api-key>
  # Add the provider keys needed by submitted jobs.
  ANTHROPIC_API_KEY: <anthropic-api-key>
  OPENAI_API_KEY: <openai-api-key>
  OPENROUTER_API_KEY: <openrouter-api-key>
