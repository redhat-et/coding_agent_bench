---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: intake-poller
  labels:
    app: intake-poller
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: intake-poller
        spec:
          restartPolicy: Never
          containers:
          - name: poller
            image: ghcr.io/redhat-et/coding_agent_bench:v0.2.0
            imagePullPolicy: Always
            command: ["uv", "run", "python", "-m", "coding_agent_bench.intake.poller"]
            env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/google/service-account.json
            - name: GOOGLE_SHEET_ID
              value: "1WSIvdLtnyaDBkF6fjYWGpyG8gPZwKl7BeHuGrxvNCKE"
            - name: JOB_QUEUE_URL
              value: http://job-queue-service
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: job-queue-secret
                  key: API_KEY
            - name: SENDER_EMAIL
              value: ace-model-evals@redhat.com
            - name: AUTO_APPROVE
              value: "false"
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "256Mi"
            volumeMounts:
            - name: google-sa-key
              mountPath: /etc/google
              readOnly: true
          volumes:
          - name: google-sa-key
            secret:
              secretName: intake-poller-google-sa
