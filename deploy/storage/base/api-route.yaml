apiVersion: route.openshift.io/v1
kind: Route
metadata:
  labels:
    app: harbor-storage
    component: rustfs
  name: harbor-storage-api
spec:
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  port:
    targetPort: api
  to:
    kind: Service
    name: harbor-storage
    weight: 100
  wildcardPolicy: None
