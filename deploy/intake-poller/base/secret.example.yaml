apiVersion: v1
kind: Secret
metadata:
  name: intake-poller-secret
type: Opaque
stringData:
  GOOGLE_SHEET_ID: <google-sheet-id>
  # Must be the service's fully-qualified name: the OpenShift serving
  # certificate is only valid for <service>.<namespace>.svc[.cluster.local],
  # so the short hostname fails TLS verification.
  JOB_QUEUE_URL: https://job-queue-service.<namespace>.svc
  AUTO_APPROVE: "false"
  ALLOW_INSECURE_QUEUE_HTTP: "false"
  service-account.json: |-
    <service-account-content>
