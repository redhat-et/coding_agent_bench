apiVersion: batch/v1
kind: CronJob
metadata:
  name: intake-poller
  labels:
    app: intake-poller
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: intake-poller
        spec:
          restartPolicy: Never
          containers:
          - name: poller
            image: ghcr.io/redhat-et/coding_agent_bench:tag
            imagePullPolicy: Always
            # Run the venv's Python directly. `uv run` re-syncs the project into
            # /app/.venv and writes a cache under $HOME at startup, both of which
            # fail under OpenShift's arbitrary run-as UID (the image content is
            # owned by 1001). The package is already installed in the image.
            command: ["/app/.venv/bin/python", "-m", "coding_agent_bench.intake.poller"]
            env:
            - name: ENVIRONMENT
              value: stage
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/google/service-account.json
            - name: GOOGLE_SHEET_ID
              valueFrom:
                secretKeyRef:
                  name: intake-poller-secret
                  key: GOOGLE_SHEET_ID
            - name: JOB_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: intake-poller-secret
                  key: JOB_QUEUE_URL
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: job-queue-secret
                  key: API_KEY
            - name: AUTO_APPROVE
              valueFrom:
                secretKeyRef:
                  name: intake-poller-secret
                  key: AUTO_APPROVE
            - name: ALLOW_INSECURE_QUEUE_HTTP
              valueFrom:
                secretKeyRef:
                  name: intake-poller-secret
                  key: ALLOW_INSECURE_QUEUE_HTTP
            # The queue is reached over its in-cluster service address, which
            # presents an OpenShift service-serving cert. Trust its CA (injected
            # into the mounted ConfigMap) so TLS verification succeeds.
            - name: JOB_QUEUE_CA_BUNDLE
              value: /etc/ssl/service-ca/service-ca.crt
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "256Mi"
            volumeMounts:
            - name: google-sa-key
              mountPath: /etc/google
              readOnly: true
            - name: service-ca
              mountPath: /etc/ssl/service-ca
              readOnly: true
          volumes:
          - name: google-sa-key
            secret:
              secretName: intake-poller-secret
              items:
                - key: service-account.json
                  path: service-account.json
          - name: service-ca
            configMap:
              name: intake-poller-ca
