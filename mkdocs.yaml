site_name: "Coding Agent Bench"

repo_url: https://github.com/redhat-et/coding_agent_bench

theme:
  name: "material"
  icon:
    logo: material/chart-box
  features:
    # Add tabs
    - navigation.tabs 
    - navigation.tabs.sticky
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings

nav:
  - Home: 
    - Home: index.md
    - Validated Harbor Commands: validated_harbor_commands.md
    - Validated Models: validated_models.md
  - CLI:
    - Overview: cli/index.md
    - Usage: cli/usage.md
  - Queue Service: 
    - Overview: queue-service/index.md
    - Setup:
      - Openshift: queue-service/openshift.md
      - Local (Developer): queue-service/local.md
      - Nebius (Optional): queue-service/nebius.md
    - Usage: queue-service/usage.md
    - Intake Poller: queue-service/intake_poller.md
  - Developer:
    - Overview: developer/index.md
    - Adding Features:
      - New Model: developer/new_model.md
      - New Harness: developer/new_harness.md
      - New Benchmark: developer/new_benchmark.md
    - Documentation: developer/documentation.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
