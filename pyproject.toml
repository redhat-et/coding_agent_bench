[project]
name = "coding-agent-bench"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.3",
    "gspread>=6.2.1",
    "harbor",
    "httpx>=0.28.1",
    "huggingface-hub>=0.20.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "tenacity>=8.0",
    "typer>=0.15.0",
]

[project.scripts]
coding-agent-bench = "coding_agent_bench.cli:app"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bump-my-version>=1.5.1",
    "bump2version>=1.0.1",
    "pytest>=9.1.1",
    "ruff>=0.15.12",
]

[tool.uv.sources]
harbor = { git = "https://github.com/redhat-et/harbor.git" }
