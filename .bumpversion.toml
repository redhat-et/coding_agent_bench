[tool.bumpversion]
current_version = "0.2.0"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "deploy/job-queue-service.yml"
search = "ghcr.io/redhat-et/coding_agent_bench:v{current_version}"
replace = "ghcr.io/redhat-et/coding_agent_bench:v{new_version}"

[[tool.bumpversion.files]]
filename = "deploy/intake-cronjob.yml"
search = "ghcr.io/redhat-et/coding_agent_bench:v{current_version}"
replace = "ghcr.io/redhat-et/coding_agent_bench:v{new_version}"
