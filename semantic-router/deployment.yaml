# Standalone vLLM Semantic Router: the router serves config.listeners itself
# (no Envoy sidecar). Mirrors upstream's Helm chart with gateway.mode=standalone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-router
  labels:
    app: semantic-router
    component: router
spec:
  replicas: 1
  # The models PVC is ReadWriteOnce, so the old pod must release it first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: semantic-router
      component: router
  template:
    metadata:
      labels:
        app: semantic-router
        component: router
    spec:
      serviceAccountName: semantic-router
      # No explicit runAsUser/runAsGroup/fsGroup: OpenShift's restricted SCC
      # assigns them. Pinning 65532 (the chart value) is rejected by
      # restricted-v2.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: semantic-router
        # Pinned by digest to the image behind :latest at the time of writing.
        # Refresh with:
        #   docker buildx imagetools inspect \
        #     ghcr.io/vllm-project/semantic-router/vllm-sr:latest
        image: ghcr.io/vllm-project/semantic-router/vllm-sr@sha256:e241c2b513f5d19fab5047464fe9d9f58f5afa1d1c3193e127a0f27e021c8059
        args:
          - -gateway=standalone
          - -listener-address=0.0.0.0
        ports:
        - containerPort: 8899
          name: http
          protocol: TCP
        - containerPort: 8080
          name: classify-api
          protocol: TCP
        - containerPort: 9190
          name: metrics
          protocol: TCP
        env:
        - name: VLLM_SR_K8S_CONFIGMAP_NAME
          value: semantic-router-config
        - name: VLLM_SR_K8S_CONFIGMAP_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: VLLM_SR_CONFIG_BACKUP_DIR
          value: /app/models/.vllm-sr/config-backups
        # The root filesystem is read-only; keep caches on writable mounts.
        - name: HOME
          value: /tmp
        - name: TMPDIR
          value: /tmp
        - name: HF_HOME
          value: /app/models/.cache/huggingface
        # Read by providers.models[].backend_refs[].auth.api_key_env in config.yaml.
        # Create this secret in the namespace before starting the router.
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: semantic-router-secret
              key: OPENAI_API_KEY
              optional: true
        # First start downloads the decision model; upstream allows 60 minutes.
        startupProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 360
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            cpu: "1"
            memory: 3Gi
          limits:
            cpu: "2"
            memory: 12Gi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: runtime-tmp
          mountPath: /tmp
        - name: config-volume
          mountPath: /app/config/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: models-volume
          mountPath: /app/models
        - name: router-data
          mountPath: /var/lib/vsr
      volumes:
      - name: runtime-tmp
        emptyDir: {}
      - name: config-volume
        configMap:
          name: semantic-router-config
      - name: models-volume
        persistentVolumeClaim:
          claimName: semantic-router-models
      - name: router-data
        emptyDir: {}
      restartPolicy: Always
